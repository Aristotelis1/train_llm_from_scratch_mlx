[project]
name = "train-llm-from-scratch-mlx"
version = "0.1.0"
description = "Train a GPT-style LLM from scratch using MLX on Apple Silicon"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "mlx>=0.31.2",
]

[project.scripts]
train-llm = "src.train:main"
generate-llm = "src.generate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
